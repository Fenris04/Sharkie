<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sharkie</title>

    <link rel="stylesheet" href="style.css" />

    <script src="models/drawable-object.class.js" defer></script>
    <script src="models/movable-object.class.js" defer></script>
    <script src="models/background-object.class.js" defer></script>

    <script src="models/status-bar.class.js" defer></script>

    <script src="models/character-base.class.js" defer></script>
    <script src="models/character-animation.class.js" defer></script>
    <script src="models/character.class.js" defer></script>

    <script src="models/puffer-fish.class.js" defer></script>
    <script src="models/jelly-fish.class.js" defer></script>
    <script src="models/bubble.class.js" defer></script>
    <script src="models/enemy-spawner.class.js" defer></script>

    <script src="models/coin.class.js" defer></script>
    <script src="models/coin-status-bar.class.js" defer></script>

    <script src="models/poison-bottle.class.js" defer></script>
    <script src="models/poison-status-bar.class.js" defer></script>

    <script src="models/endboss-base.class.js" defer></script>
    <script src="models/endboss-animation.class.js" defer></script>
    <script src="models/endboss.class.js" defer></script>
    <script src="models/boss-projectile.class.js" defer></script>

    <script src="models/world-base.class.js" defer></script>
    <script src="models/world-render.class.js" defer></script>
    <script src="models/world-collision.class.js" defer></script>
    <script src="models/world-collectibles.class.js" defer></script>
    <script src="models/world-boss.class.js" defer></script>

    <script src="models/world.class.js" defer></script>

    <script src="js/keyboard.js" defer></script>
    <script src="js/game.js" defer></script>
  </head>

  <body>
    <h1>Sharkie</h1>

    <div class="game-container">
      <canvas id="canvas" width="720" height="480"></canvas>

      <div id="game-over-screen" class="game-over-screen">
        <img
          class="game-over-title"
          src="assets/6.Botones/Tittles/Game Over/Recurso 13.png"
          alt="Game Over"
        />

        <button id="restart-button" class="restart-button" type="button">
          Try again
        </button>
      </div>

      <div id="you-win-screen" class="you-win-screen">
        <h2 class="you-win-title">YOU WIN!</h2>

        <button id="win-restart-button" class="restart-button" type="button">
          Play again
        </button>
      </div>
    </div>
  </body>
</html>
